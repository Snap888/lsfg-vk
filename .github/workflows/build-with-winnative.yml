name: "Build LSFG-VK + WinNative"

# Запускается при пуше в lsfg-vk ИЛИ вручную
on:
  push:
    branches: [ main ]
    paths:
      - 'layer/**'
      - 'shaders/**'
      - 'CMakeLists.txt'
      - 'compile_shaders.sh'
  workflow_dispatch:
    inputs:
      wn_branch:
        description: 'Ветка WinNative для сборки APK'
        default: 'Snap888-patch-1'
        required: true

env:
  ANDROID_NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION:       "3.22.1"
  WN_REPO:             "Snap888/WinNative"
  WN_BRANCH:           ${{ github.event.inputs.wn_branch || 'Snap888-patch-1' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-layer:
    name: "Build LSFG-VK .so (ARM64)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout lsfg-vk
        uses: actions/checkout@v4

      - name: Install NDK + CMake
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$CMAKE_VERSION" 2>&1 | tail -5
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"   >> $GITHUB_ENV
          echo "NDK_CMAKE=$ANDROID_SDK_ROOT/cmake/$CMAKE_VERSION/bin/cmake" >> $GITHUB_ENV
          echo "NDK_NINJA=$ANDROID_SDK_ROOT/cmake/$CMAKE_VERSION/bin/ninja" >> $GITHUB_ENV

      - name: Fetch Vulkan headers
        run: |
          git clone --depth=1 --branch v1.3.268 \
            https://github.com/KhronosGroup/Vulkan-Headers /tmp/vulkan-headers
          echo "VULKAN_HEADERS_DIR=/tmp/vulkan-headers/include" >> $GITHUB_ENV

      - name: Install glslangValidator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools

      - name: Compile shaders
        run: |
          chmod +x compile_shaders.sh
          ./compile_shaders.sh

      - name: CMake configure
        run: |
          $NDK_CMAKE -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=$NDK_NINJA \
            -DCMAKE_CXX_FLAGS="-I$VULKAN_HEADERS_DIR"

      - name: Build .so
        run: $NDK_CMAKE --build build --parallel $(nproc)

      - name: Verify .so
        run: |
          SO=build/libVkLayer_lsfg_frame_generation.so
          ls -lh $SO
          file $SO
          
          # Проверяем экспорты. 
          # ВАЖНО: флаг --dynamic обязателен для Release/stripped библиотек, 
          # так как он проверяет таблицу динамических символов (.dynsym), 
          # которая используется загрузчиком Vulkan.
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm \
            --dynamic --defined-only --extern-only $SO | grep -E "vkNegotiate|vkGetInstance"

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-vk-arm64
          path: |
            build/libVkLayer_lsfg_frame_generation.so
            manifest/VkLayer_lsfg_frame_generation.json
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  build-winnative:
    name: "Build WinNative APK with LSFG-VK"
    runs-on: ubuntu-latest
    needs: build-layer
    permissions:
      contents: read

    steps:
      - name: Checkout WinNative
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WN_REPO }}
          ref:        ${{ env.WN_BRANCH }}
          submodules: recursive
          token:      ${{ secrets.GITHUB_TOKEN }}

      - name: Download LSFG-VK .so
        uses: actions/download-artifact@v4
        with:
          name: lsfg-vk-arm64
          path: /tmp/lsfg-vk

      - name: Copy layer into WinNative jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/lsfg-vk/libVkLayer_lsfg_frame_generation.so \
             app/src/main/jniLibs/arm64-v8a/

          mkdir -p app/src/main/assets
          cp /tmp/lsfg-vk/VkLayer_lsfg_frame_generation.json \
             app/src/main/assets/

          echo "✅ Layer installed:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libVkLayer_lsfg_frame_generation.so

      - name: Copy Kotlin integration sources
        run: |
          # Если lsfg-vk содержит Kotlin обёртку — копируем её
          DEST=app/src/main/kotlin/com/winlator/cmod/runtime/display/framegen
          mkdir -p $DEST
          # Файлы уже будут в winnative/ директории lsfg-vk repo
          # В реальной интеграции они уже в WinNative исходниках

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build WinNative Standard APK
        run: ./gradlew assembleStandardDebug --no-daemon -PversionCode=1

      - name: Upload WinNative APK
        uses: actions/upload-artifact@v4
        with:
          name: winnative-lsfg-vk-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          retention-days: 14

      - name: Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Артефакт | Размер |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| libVkLayer_lsfg_frame_generation.so | $(du -sh app/src/main/jniLibs/arm64-v8a/libVkLayer_lsfg_frame_generation.so | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          APK=$(ls app/build/outputs/apk/standard/debug/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "| WinNative APK | $(du -sh $APK | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| WinNative APK | Not found |" >> $GITHUB_STEP_SUMMARY
          fi
