name: Build LSFG-VK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NDK r26 and CMake 3.22
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" 2>&1 | tail -5
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.1.10909125"   >> $GITHUB_ENV
          echo "NDK_CMAKE=$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" >> $GITHUB_ENV
          echo "NDK_NINJA=$ANDROID_SDK_ROOT/cmake/3.22.1/bin/ninja" >> $GITHUB_ENV

      - name: Get Vulkan Headers (includes vk_layer.h for layer development)
        run: |
          git clone --depth=1 --branch v1.3.268 \
            https://github.com/KhronosGroup/Vulkan-Headers /tmp/vulkan-headers
          echo "VULKAN_HEADERS_DIR=/tmp/vulkan-headers/include" >> $GITHUB_ENV

      - name: Install glslangValidator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Compile GLSL shaders to SPIR-V
        run: |
          chmod +x compile_shaders.sh
          ./compile_shaders.sh

      - name: Configure CMake
        run: |
          $NDK_CMAKE -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=$NDK_NINJA \
            -DCMAKE_CXX_FLAGS="-I$VULKAN_HEADERS_DIR"

      - name: Build .so
        run: $NDK_CMAKE --build build --parallel $(nproc)

      - name: Collect output files
        run: |
          mkdir -p output/arm64-v8a
          cp build/libVkLayer_lsfg_frame_generation.so output/arm64-v8a/
          cp build/VkLayer_lsfg_frame_generation.json  output/
          echo "=== Build output ==="
          ls -lh output/arm64-v8a/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-vk-android-arm64
          path: |
            output/arm64-v8a/libVkLayer_lsfg_frame_generation.so
            output/VkLayer_lsfg_frame_generation.json
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/arm64-v8a/libVkLayer_lsfg_frame_generation.so
            output/VkLayer_lsfg_frame_generation.json
