name: Build LSFG-VK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:  # ручной запуск из GitHub UI

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Java (нужна для Gradle) ──────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─── Android NDK ─────────────────────────────────────────────────────────
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # ─── Vulkan / glslangValidator ────────────────────────────────────────────
      - name: Install Vulkan SDK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      # ─── Compile shaders ─────────────────────────────────────────────────────
      - name: Compile GLSL shaders → SPIR-V
        run: |
          chmod +x compile_shaders.sh
          ./compile_shaders.sh

      # ─── Build via CMake ──────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=$ANDROID_SDK_ROOT/cmake/3.22.1/bin/ninja

      - name: Build .so
        run: cmake --build build --parallel $(nproc)

      # ─── Collect artifacts ────────────────────────────────────────────────────
      - name: Collect output files
        run: |
          mkdir -p output/arm64-v8a
          cp build/libVkLayer_lsfg_frame_generation.so output/arm64-v8a/
          cp build/VkLayer_lsfg_frame_generation.json  output/
          ls -lh output/arm64-v8a/

      # ─── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-vk-android-arm64
          path: |
            output/arm64-v8a/libVkLayer_lsfg_frame_generation.so
            output/VkLayer_lsfg_frame_generation.json
          retention-days: 30

      # ─── Upload to Release (только при создании release) ─────────────────────
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/arm64-v8a/libVkLayer_lsfg_frame_generation.so
            output/VkLayer_lsfg_frame_generation.json
